<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steppify</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
padding:0;
background:#ffffff;
text-align:center;
}

header{
padding:20px;
font-size:32px;
font-weight:bold;
}

.hero{
padding:50px 20px;
}

input{
width:80%;
max-width:500px;
padding:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

.card{
margin:15px auto;
padding:15px;
width:80%;
max-width:500px;
border:1px solid #ddd;
border-radius:10px;
}
</style>
</head>

<body>

<header>
STEPPIFY
</header>

<div class="hero">
<h1>Resolver Agora</h1>

<p>Digite o problema. Siga os passos. Resolva.</p>

<input placeholder="O que você quer resolver hoje?">

<div class="card">Recuperar Instagram</div>
<div class="card">Criar Conta PayPal</div>
<div class="card">Usar ChatGPT</div>
<div class="card">Criar Currículo</div>

</div>

</body>
</html>
